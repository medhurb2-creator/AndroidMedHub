<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="MedVix" />
    <meta name="description" content="MedVix — Learn. Practice. Connect. Grow. Achieve." />
    <title>MedVix</title>
    <!-- High-resolution favicon (modern browsers) -->
<link rel="icon" type="image/png" sizes="192x192" href="/assets/images/logo.png">

<!-- Apple touch icon (iOS home screen) -->
<link rel="apple-touch-icon" href="/assets/images/logo.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/images/logo.png">

    <!-- Global CSS (shared by all pages) -->
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="/libs/fontawesome/css/all.min.css" />

    <!-- Manifest & preloads -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/assets/images/splash.png" as="image" />
    <!-- In index.html -->
    <link rel="stylesheet" href="/libs/quill/quill.snow.css">
    <script src="/libs/quill/quill.min.js"></script>
    <script defer src="/libs/chart/chart.min.js"></script>
    <script src="/libs/pdfjs/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = '/libs/pdfjs/pdf.worker.min.js';
    </script>
    <script src="/libs/pdfkit.standalone.js"></script>

    <!-- ============================================================
         SPLASH‑SPECIFIC CSS – only what’s needed for the overlay
         ============================================================ -->
    <style id="medvix-splash-css">
        /* ===== Splash overlay ===== */
        #app-bootstrap {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 60px;
            background-image: url('/assets/images/splash.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 0.5s ease;
        }

        /* Gradient at bottom */
        #app-bootstrap::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Referral badge */
        #app-bootstrap .referral-badge {
            position: relative;
            z-index: 1;
            margin-bottom: 1.2rem;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(37, 99, 235, 0.4);
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            color: #60a5fa;
            letter-spacing: 0.5px;
            animation: medvixSplashBadgePulse 2s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: none; /* shown by JS if referral exists */
        }

        #app-bootstrap .referral-badge span {
            font-weight: 600;
            color: #fff;
        }

        @keyframes medvixSplashBadgePulse {

            0%,
            100% {
                opacity: 0.8;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.04);
            }
        }

        /* Loading section */
        #app-bootstrap .loading-section {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
            max-width: 280px;
            margin-bottom: 1.5rem;
        }

        #app-bootstrap .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: medvixSplashSpin 0.8s linear infinite;
        }

        @keyframes medvixSplashSpin {
            to {
                transform: rotate(360deg);
            }
        }

        #app-bootstrap .progress-track {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        #app-bootstrap .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa, #2563eb);
            background-size: 200% 100%;
            border-radius: 9999px;
            animation: medvixSplashProgressShimmer 1.5s linear infinite;
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.4);
        }

        @keyframes medvixSplashProgressShimmer {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 200% 0%;
            }
        }

        #app-bootstrap .loading-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            min-height: 1.5em;
        }

        #app-bootstrap .loading-text .dot {
            display: inline-block;
            animation: medvixSplashDotPulse 1.4s ease-in-out infinite;
        }

        #app-bootstrap .loading-text .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        #app-bootstrap .loading-text .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes medvixSplashDotPulse {

            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }

        #app-bootstrap .version-info {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
            font-weight: 300;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            margin-top: 0.25rem;
        }

        /* SPA mount point – initially empty */
        #app-root {
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* When app is ready, hide bootstrap */
        .app-ready #app-bootstrap {
            opacity: 0 !important;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- ============================================================
         TEMPORARY SPLASH SCREEN – removed after first page loads
         ============================================================ -->
    <div id="app-bootstrap" aria-live="polite" aria-label="Loading MedVix">
        <div class="referral-badge" id="referralBadge">
            🎯 Referral: <span id="refBadgeCode">—</span>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="spinner" id="spinner"></div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="loading-text" id="loadingText">
                Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
        </div>

        <div class="version-info">v1.0.2</div>
    </div>

    <!-- ============================================================
         SPA APPLICATION HOST – page HTML is injected here
         ============================================================ -->
    <div id="app-root" data-app="medvix"></div>

    <!-- ============================================================
         DEEP‑LINK CAPTURE (Capacitor)
         ============================================================ -->
    <script>
        if (window.Capacitor?.Plugins?.App) {
            const App = window.Capacitor.Plugins.App;
            // Capture launch URL (app opened via deep‑link)
            App.getLaunchUrl().then(result => {
                if (result?.url) {
                    console.log('[DeepLink] Launch URL:', result.url);
                    sessionStorage.setItem('deepLink', result.url);
                }
            }).catch(err => console.warn('[DeepLink] getLaunchUrl error:', err));

            // Listen for deep‑links while app is already running
            App.addListener('appUrlOpen', (data) => {
                console.log('[DeepLink] appUrlOpen:', data.url);
                // If router is ready, navigate immediately; otherwise store for later
                if (window.router && typeof window.router.navigateTo === 'function') {
                    window.router.navigateTo(data.url);
                } else {
                    sessionStorage.setItem('deepLink', data.url);
                }
            });
        }
    </script>

    <!-- ============================================================
         SINGLE ENTRY POINT – app.js bootstraps everything
         ============================================================ -->
    <script type="module" src="/scripts/app.js"></script>

</body>

</html>
