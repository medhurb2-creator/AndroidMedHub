apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.medhurb.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.medhurb.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['keystorePath'] ?: "dummy")
            storePassword keystoreProperties['keystorePassword'] ?: ""
            keyAlias keystoreProperties['keyAlias'] ?: ""
            keyPassword keystoreProperties['keyPassword'] ?: ""
        }
    }

    buildTypes {
        release {
            // CHANGED: was false — enables R8 shrinking, obfuscation, optimisation
            minifyEnabled true

            // CHANGED: was 'proguard-android.txt' (includes -dontoptimize).
            // 'proguard-android-optimize.txt' is Google's recommended default.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // OPTIONAL — enable only after code minification is tested and stable.
            // Uncomment once you have verified release builds work with minifyEnabled alone.
            // shrinkResources true

            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // ── androidx.core — REQUIRED EXPLICITLY ─────────────────────────
    //
    // MainActivity calls WindowInsetsControllerCompat.setSystemBarsAppearance()
    // with the APPEARANCE_LIGHT_STATUS_BARS constant. That constant was
    // added in androidx.core 1.5.0; before that the symbol does not
    // exist and compileReleaseJavaWithJavac fails with
    //
    //     cannot find symbol: variable APPEARANCE_LIGHT_STATUS_BARS
    //
    // Nothing in the current dependency graph pulls androidx.core in
    // with a guaranteed minimum, so a plugin pinning an old version
    // (or a stale transitive resolution) silently breaks the build.
    // Declaring it here fixes the resolved version at 1.13.0 — well
    // above the 1.5.0 floor, stable, and compatible with every
    // Capacitor 6 plugin currently in use.
    //
    // If a future plugin forces androidx.core below 1.5.0 (via a
    // strict version), the `force` block at the bottom of this file
    // wins. Do not remove that block without re-running
    //   ./gradlew :app:dependencies --configuration releaseCompileClasspath | grep androidx.core
    // to verify the resolved version.
    implementation "androidx.core:core:1.13.0"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Google Play In-App Updates (Flexible + Immediate)
    implementation 'com.google.android.play:app-update:2.1.0'

    // Google Play In-App Review API
    //
    // NOTE: ReviewManagerHelper imports Task / OnCompleteListener from
    // com.google.android.gms.tasks, NOT the retired play.core.tasks
    // package. This artifact pulls com.google.android.gms:play-services-tasks
    // in transitively, so those imports resolve with no extra Gradle change.
    implementation 'com.google.android.play:review:2.0.1'

    // Google Play Install Referrer (deferred deep links)
    implementation "com.android.installreferrer:installreferrer:2.2"
}

// ── Resolution guards ───────────────────────────────────────────────
//
// Defence in depth: if any plugin — present or future — tries to pull
// androidx.core below the version that exposes APPEARANCE_LIGHT_STATUS_BARS
// (1.5.0), or play-services-tasks below the version the review helper
// compiles against, force the floor. Without these guards a single
// misbehaving plugin can silently break the release build after a
// dependency refresh, and the failure surfaces as a confusing
// "cannot find symbol" instead of a version conflict.
configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.13.0"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}