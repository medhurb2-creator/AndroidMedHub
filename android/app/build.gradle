apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.medhurb.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.medhurb.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['keystorePath'] ?: "dummy")
            storePassword keystoreProperties['keystorePassword'] ?: ""
            keyAlias keystoreProperties['keyAlias'] ?: ""
            keyPassword keystoreProperties['keyPassword'] ?: ""
        }
    }

    buildTypes {
        release {
            // CHANGED: was false — enables R8 shrinking, obfuscation, optimisation
            minifyEnabled true

            // CHANGED: was 'proguard-android.txt' (includes -dontoptimize).
            // 'proguard-android-optimize.txt' is Google's recommended default.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // OPTIONAL — enable only after code minification is tested and stable.
            // Uncomment once you have verified release builds work with minifyEnabled alone.
            // shrinkResources true

            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // ── androidx.core — REQUIRED EXPLICITLY ─────────────────────────
    //
    // Declares the direct dependency so a version is on the graph even
    // before resolution runs. The MINIMUM version is enforced by the
    // subprojects { configurations.all { force … } } block in the
    // PROJECT-ROOT build.gradle — not here. A force rule declared in
    // this module file runs BEFORE `apply from: 'capacitor.build.gradle'`
    // below, and anything that file (or the root project) applies
    // afterward can override it. That is why the previous in-module
    // `configurations.all` block did not actually pin 1.13.0 and the
    // release build still failed with
    //
    //     cannot find symbol: variable APPEARANCE_LIGHT_STATUS_BARS
    //
    // Moving the force to root level means it runs last and wins.
    //
    // MainActivity currently uses WindowInsetsCompat
    // .APPEARANCE_LIGHT_STATUS_BARS (the deprecated alias) so this
    // build compiles regardless of the resolved version — but keeping
    // the resolution consistent prevents a future cleanup from
    // re-introducing the same failure.
    implementation "androidx.core:core:1.13.0"

    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Google Play In-App Updates (Flexible + Immediate)
    implementation 'com.google.android.play:app-update:2.1.0'

    // Google Play In-App Review API
    //
    // NOTE: ReviewManagerHelper imports Task / OnCompleteListener from
    // com.google.android.gms.tasks, NOT the retired play.core.tasks
    // package. This artifact pulls com.google.android.gms:play-services-tasks
    // in transitively, so those imports resolve with no extra Gradle change.
    implementation 'com.google.android.play:review:2.0.1'

    // Google Play Install Referrer (deferred deep links)
    implementation "com.android.installreferrer:installreferrer:2.2"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}