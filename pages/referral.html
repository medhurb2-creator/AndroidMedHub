<section
  class="page referral-page"
  data-page="referral"
  data-script="/scripts/pages/referral.js"
  data-style="/css/referral.css"
  data-title="Referrals"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <!-- Shimmer Skeleton Overlay -->
  <div id="shimmer-overlay" class="shimmer-overlay">
    <div class="shimmer-grid">
      <div class="shimmer-card">
        <div class="shimmer-line short"></div>
        <div class="shimmer-line medium"></div>
        <div class="shimmer-line large"></div>
      </div>
      <div class="shimmer-card">
        <div class="shimmer-line short"></div>
        <div class="shimmer-line medium"></div>
        <div class="shimmer-line short" style="width:30%;"></div>
      </div>
      <div class="shimmer-card">
        <div class="shimmer-line short"></div>
        <div class="shimmer-line large"></div>
        <div class="shimmer-line medium"></div>
        <div class="shimmer-line large"></div>
      </div>
    </div>
    <div class="shimmer-subtitle">Loading your referral dashboard…</div>
  </div>

  <!-- Main content -->
  <div id="main-content">
    <!-- Fixed Header (2 rows) -->
    <header class="fixed-header">
      <div class="header-row top">
        <div class="left-group">
          <button id="backSubjectsBtn" class="btn-text">← Subjects</button>
        </div>
        <div class="right-group">
          <button id="themeToggle" class="btn-outline">🌓</button>
        </div>
      </div>
      <div class="header-row bottom">
        <div class="title-area">
          <h1>💰 Refer & Earn</h1>
        </div>
        <div id="header-status" style="font-size: 0.85rem; color: var(--text-muted);"></div>
      </div>
    </header>

    <main>
      <div id="dashboard-container">
        <!-- Rendered by referral-ui.js -->
      </div>

      <div class="action-buttons" style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
        <button id="backSubjectsFooterBtn" class="btn-secondary">← Back to Subjects</button>
        <button id="profileBtn" class="btn-secondary">👤 Profile</button>
      </div>
    </main>
  </div>
</section>
