<section
  class="page pdf-settings-page"
  data-page="pdf-settings"
  data-script="/scripts/pages/pdf-settings.js"
  data-style="/css/pdf-settings.css"
  data-title="PDF Settings"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <!-- Shimmer -->
  <div id="shimmer-content">
    <div class="shimmer-header">
      <div class="shimmer-logo">
        <div class="shimmer-logo-icon"></div>
        <div class="shimmer-logo-text"></div>
      </div>
      <div>
        <span class="shimmer-btn-sm" style="margin-right:0.5rem;"></span>
        <span class="shimmer-btn-sm"></span>
      </div>
    </div>
    <div class="shimmer-wrapper">
      <div class="shimmer-subject">
        <div class="shimmer-icon"></div>
        <div class="shimmer-title"></div>
      </div>
      <div class="shimmer-stats">
        <div class="shimmer-stat"></div>
        <div class="shimmer-stat"></div>
        <div class="shimmer-stat"></div>
      </div>
      <div class="shimmer-actions">
        <div class="shimmer-btn"></div>
        <div class="shimmer-btn"></div>
      </div>
      <div class="shimmer-topics">
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
      </div>
    </div>
  </div>

  <!-- Real content -->
  <div id="real-content">
    <div class="page-container">
      <header class="fixed-header">
        <div class="header-row top">
          <div class="left-group">
            <img src="/assets/images/logo.png" alt="Logo" width="32" height="32" />
            <span class="brand">MedVix</span>
            <button id="backBtn" class="btn-text">← Back to Topics</button>
          </div>
          <div class="right-group">
            <button id="themeToggle" class="btn-outline">🌓</button>
          </div>
        </div>
        <div class="header-row bottom">
          <span style="font-weight:600; font-size:1.1rem;">📄 PDF Settings</span>
        </div>
      </header>

      <div class="settings-container">
        <!-- Summary Card -->
        <div class="settings-card">
          <div class="card-title">
            <span id="pdf-subject-icon"></span>
            <span id="pdf-subject-name"></span>
            <span class="color-dot"
              style="background:var(--accent); display:inline-block; width:12px; height:12px; border-radius:50%;"></span>
          </div>
          <div class="summary-stats"
            style="display:flex; gap:0.75rem; flex-wrap:wrap; font-size:0.9rem; color:var(--text-secondary);">
            <span id="pdf-topic-names"></span>
          </div>
          <div id="sub-required-msg"
            style="display:none; color:var(--accent); font-weight:600; margin-top:0.5rem;">
            ⭐ Active subscription required to generate PDFs.
          </div>
        </div>

        <!-- Options Card -->
        <div class="settings-card">
          <div class="card-title">⚙️ Configure Your PDF</div>
          <div class="option-group">
            <div class="option-row">
              <label for="pdf-exam-code">Exam Code (optional)</label>
              <input type="text" id="pdf-exam-code" placeholder="e.g. AN1A2B3C4D5E" maxlength="12"
                style="width:170px; padding:0.4rem 0.8rem; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg-secondary); color:var(--text-primary); text-transform:uppercase;" />
              <button id="decodeCodeBtn" class="btn-secondary"
                style="padding:0.4rem 1rem;">Decode</button>
            </div>
            <div class="option-row">
              <label for="pdf-question-count">Number of Questions</label>
              <input type="number" id="pdf-question-count" min="1" max="60" value="10" />
              <span style="font-size:0.85rem; color:var(--text-muted);">(max 60)</span>
            </div>
          </div>

          <div
            style="margin: 1rem 0 0.5rem 0; font-weight:500; border-bottom:1px solid var(--border); padding-bottom:0.5rem;">
            Document Types
          </div>
          <div class="option-group">
            <div class="option-row">
              <label>
                <input type="checkbox" id="include-questions" checked />
                Question Paper
              </label>
              <label>
                <input type="checkbox" id="include-answer-sheet" checked />
                Answer Sheet
              </label>
              <label>
                <input type="checkbox" id="include-answer-booklet" checked />
                Answer Booklet
              </label>
            </div>
          </div>

          <div class="option-group">
            <div class="option-row">
              <label>
                <input type="checkbox" id="include-fillout" checked />
                Include fill‑out fields (name, date, etc.)
              </label>
            </div>
          </div>

          <div class="limit-warning">
            ⚠️ Max <strong>3 PDFs per day</strong> and <strong>6 per week</strong>.
          </div>
        </div>

        <!-- Action Button -->
        <div class="action-row">
          <button id="generatePdfBtn" class="btn-generate">Generate PDF</button>
        </div>
      </div>

      <footer></footer>
    </div>
  </div>
</section>
