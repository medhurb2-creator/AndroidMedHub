<section
  class="page resource-browser-page"
  data-page="resource-browser"
  data-script="/scripts/pages/resource-browser.js"
  data-style="/css/resource-browser.css"
  data-title="Resources"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <!-- ============================================================
       APP VIEW — Resource Browser
       ============================================================ -->
  <div id="app">
    <header class="fixed-header">
      <div class="header-row">
        <div class="logo-area">
          <img src="/assets/images/logo.png" alt="Logo" width="30" height="30">
          <span>MedVix</span>
        </div>
        <div class="nav-buttons">
          <button id="backBtn" aria-label="Back">← Back</button>
          <button id="themeBtn" aria-label="Toggle theme">🌓</button>
        </div>
      </div>
      <div class="header-row">
        <div class="title-area">
          <h1 id="page-title">Study Resources</h1>
        </div>
      </div>
      <div class="header-row search-filter-row">
        <input type="text" id="search-input" placeholder="Search documents..." autocomplete="off">
        <div class="filter-wrapper">
          <button class="filter-btn" id="filter-btn">☰ Filter</button>
          <div class="filter-dropdown" id="filter-dropdown">
            <button data-filter="all" class="active-filter">All</button>
            <button data-filter="favorites">⭐ Favorites</button>
            <button data-filter="downloaded">✅ Downloaded</button>
            <button data-filter="recent">🕒 Recent</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main-with-header">
      <div id="resource-grid" class="resource-grid">
        <!-- Rendered by resource-browser.js -->
      </div>

      <div id="load-more-container">
        <div id="load-more-spinner" style="display: none;" class="loading-spinner-small">Loading more...</div>
        <button id="load-more-btn" class="btn-secondary" style="display: none;">Load More</button>
      </div>
    </main>
  </div>

  <!-- ============================================================
       VIEWER VIEW — Embedded document viewer

       DOM contract with core.js / ui-internal.js / render.js:

       .viewer-container is a 3-row CSS grid:
         row 1  → .viewer-header    (header chrome)
         row 2  → .viewer-main      (page canvas + scroll surface)
         row 3  → .viewer-footer    (page nav, zoom controls)

       Three nodes share grid-area:main and stack vertically:
         #viewer-main           → z-index 1  (the page canvas + scroll surface)
         #viewer-drawer-scrim   → z-index 35 (dim backdrop; tap to close)
         #viewer-outline-drawer → z-index 40 (sidebar; slides in from left)

       Because they share the same grid cell, the drawer automatically
       spans exactly from the bottom of the header to the top of the
       footer — no JS measurement of chrome heights required.

       Static chrome nodes inside #viewer-main survive every document
       switch (clearViewerContent preserves them by ID):
         #viewer-loading       — spinner
         #viewer-progress      — progress bar
         #viewer-text-layer    — reserved text layer host
         #viewer-content       — reserved alternate content host

       The sidebar is a single shell that hosts three panels, selected
       by the `data-panel` attribute:
         data-panel="outline" → document outline (default)
         data-panel="search"  → search input + results list
         data-panel="more"    → document info + action buttons

       ui-internal.js::_openSidebar(panel) sets the attribute and
       dispatches to managers so the correct panel renders.

       Header layout (matches pages/viewer.html):
         Row 1: [Back]  [Title]  [☰ Menu]
         Row 2 (on toggle): inline search bar
         Dropdown menu on the ☰ button contains:
           Outline · Search text · Page view · Open file
           Fit to width · Reset zoom · Fullscreen

       Footer contains only navigation and continuous zoom:
         [◀ Previous]  [Page #/total]  [Next ▶]
         [−] [zoom %] [+]

       Fit and Reset live ONLY in the menu — no duplicate IDs.
       The menu IDs match pages/viewer.html so ui-internal.js works
       identically on both pages.
       ============================================================ -->
  <div id="viewer" style="display: none;">
    <div class="viewer-container">

      <!-- ─── Header ──────────────────────────────────────────────── -->
      <header class="viewer-header" id="viewer-header">
        <div class="viewer-header-main">
          <button id="viewer-back-btn" class="btn-back" type="button" aria-label="Close document">
            <span aria-hidden="true">←</span> Back
          </button>

          <div class="viewer-title" id="viewer-title">Loading…</div>

          <button
            id="viewer-menu-btn"
            class="btn-icon btn-menu"
            type="button"
            title="Menu"
            aria-label="Open menu"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="viewer-menu"
          >☰</button>
        </div>

        <!-- ─── Dropdown menu ──────────────────────────────────────
             Every viewer action that used to be a top-level header
             button lives here now. IDs are unchanged so existing
             handlers in ui-internal.js continue to work. -->
        <div class="viewer-menu" id="viewer-menu" role="menu" hidden>
          <button class="viewer-menu-item" id="viewer-outline-btn" type="button" role="menuitem">
            <span class="viewer-menu-icon" aria-hidden="true">☰</span>
            <span class="viewer-menu-label">Outline</span>
          </button>

          <button class="viewer-menu-item" id="viewer-search-btn" type="button" role="menuitem">
            <span class="viewer-menu-icon" aria-hidden="true">🔍</span>
            <span class="viewer-menu-label">Search text</span>
          </button>

          <button class="viewer-menu-item" id="viewer-toggle-view" type="button" role="menuitem">
            <span class="viewer-menu-icon" aria-hidden="true">📄</span>
            <span class="viewer-menu-label" id="viewer-toggle-view-label">Page view</span>
          </button>

          <button class="viewer-menu-item" id="viewer-open-local" type="button" role="menuitem">
            <span class="viewer-menu-icon" aria-hidden="true">📂</span>
            <span class="viewer-menu-label">Open file</span>
          </button>

          <div class="viewer-menu-divider" role="separator"></div>

          <button class="viewer-menu-item" id="viewer-zoom-fit" type="button" role="menuitem">
            <span class="viewer-menu-icon" aria-hidden="true">↔</span>
            <span class="viewer-menu-label">Fit to width</span>
          </button>

          <button class="viewer-menu-item" id="viewer-zoom-reset" type="button" role="menuitem">
            <span class="viewer-menu-icon" aria-hidden="true">1:1</span>
            <span class="viewer-menu-label">Reset zoom</span>
          </button>

          <button class="viewer-menu-item" id="viewer-fullscreen-btn" type="button" role="menuitem" aria-pressed="false">
            <span class="viewer-menu-icon" aria-hidden="true">⛶</span>
            <span class="viewer-menu-label">Fullscreen</span>
          </button>
        </div>
      </header>

      <!-- ─── Search bar (appears below the header when toggled) ────
           Toggled by the Search text item in the dropdown menu. -->
      <div class="search-bar" id="viewer-search-bar" role="search">
        <input
          type="text"
          id="viewer-search-input"
          placeholder="Find…"
          autocomplete="off"
          aria-label="Search text"
        >
        <span class="search-results" id="viewer-search-count" aria-live="polite"></span>
        <button id="viewer-search-prev" class="btn-icon" type="button" title="Previous match" aria-label="Previous match">↑</button>
        <button id="viewer-search-next" class="btn-icon" type="button" title="Next match" aria-label="Next match">↓</button>
        <div class="search-options" id="viewer-search-options">
          <label><input type="checkbox" id="viewer-search-case"> Aa</label>
          <label><input type="checkbox" id="viewer-search-whole"> “”</label>
        </div>
        <button id="viewer-search-close" class="btn-icon" type="button" title="Close search" aria-label="Close search">✕</button>
      </div>

      <!-- ─── Main viewing area ──────────────────────────────────── -->
      <main class="viewer-main" id="viewer-main" tabindex="-1">
        <!-- Static chrome (preserved by clearViewerContent on destroy) -->
        <div class="loading-container" id="viewer-loading">
          <div class="spinner"></div>
          <p>Loading document…</p>
        </div>

        <progress id="viewer-progress" style="display: none;" max="1" value="0"></progress>

        <!-- Reserved: text layer host (populated when text selection is enabled) -->
        <div id="viewer-text-layer" class="textLayer" aria-hidden="true"></div>

        <!-- Reserved: alternate content host (image / text / office / unsupported) -->
        <div id="viewer-content"></div>

        <!-- Page containers and canvases are inserted here by core.js.
             Nothing static goes after this point. -->
      </main>

      <!-- ─── Footer ─────────────────────────────────────────────── -->
      <footer class="viewer-footer" id="viewer-footer" style="display: none;">
        <div class="page-nav">
          <button id="viewer-prev-page" type="button" disabled aria-label="Previous page">◀ Previous</button>
          <div class="page-counter">
            <label for="viewer-page-input">Page</label>
            <input
              type="number"
              id="viewer-page-input"
              value="1"
              min="1"
              step="1"
              inputmode="numeric"
              aria-label="Page number"
            >
            <span>of <span id="viewer-page-count">1</span></span>
          </div>
          <button id="viewer-next-page" type="button" disabled aria-label="Next page">Next ▶</button>
        </div>

        <!-- Zoom controls: continuous zoom in/out only.
             Fit and Reset have moved to the dropdown menu so the two
             surfaces do not share IDs. -->
        <div class="zoom-controls">
          <button id="viewer-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
          <span id="viewer-zoom-level" aria-live="polite">100%</span>
          <button id="viewer-zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
      </footer>

      <!-- ─── Drawer scrim (tap to close) ─────────────────────────
           Shares grid-area:main with #viewer-main and #viewer-outline-drawer.
           Sits at z-index 35 — below the drawer (40), above the page (1).
           Tap-to-close is wired by ui-internal.js. -->
      <div id="viewer-drawer-scrim" aria-hidden="true"></div>

      <!-- ─── Drawer / sidebar ─────────────────────────────────────
           One shell, multiple panels. `data-panel` selects which panel's
           content is shown. ui-internal.js toggles `.open` and calls
           managers.dispatchPanel(panel) to render the right panel. -->
      <aside
        class="outline-drawer"
        id="viewer-outline-drawer"
        data-panel="outline"
        role="complementary"
        aria-label="Viewer sidebar"
        aria-hidden="true"
        tabindex="-1"
      ></aside>

      <!-- ─── Hidden file input ────────────────────────────────────
           Kept inside .viewer-container so it dies with the container.
           display:none means it takes no grid cell. -->
      <input
        type="file"
        id="viewer-file-input"
        class="file-input"
        accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.docx,.doc,.pptx,.ppt,.txt,.md"
      >
    </div>
  </div>
</section>
