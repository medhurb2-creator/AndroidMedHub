<section
  class="page resource-browser-page"
  data-page="resource-browser"
  data-script="/scripts/pages/resource-browser.js"
  data-style="/css/resource-browser.css"
  data-title="Resources"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <!-- ===== APP VIEW (Resource Browser) ===== -->
  <div id="app">
    <header class="fixed-header">
      <div class="header-row">
        <div class="logo-area">
          <img src="/assets/images/logo.png" alt="Logo" width="30" height="30">
          <span>MedVix</span>
        </div>
        <div class="nav-buttons">
          <button id="backBtn" aria-label="Back">← Back</button>
          <button id="themeBtn" aria-label="Toggle theme">🌓</button>
        </div>
      </div>
      <div class="header-row">
        <div class="title-area">
          <h1 id="page-title">Study Resources</h1>
        </div>
      </div>
      <div class="header-row search-filter-row">
        <input type="text" id="search-input" placeholder="Search documents..." autocomplete="off">
        <div class="filter-wrapper">
          <button class="filter-btn" id="filter-btn">☰ Filter</button>
          <div class="filter-dropdown" id="filter-dropdown">
            <button data-filter="all" class="active-filter">All</button>
            <button data-filter="favorites">⭐ Favorites</button>
            <button data-filter="downloaded">✅ Downloaded</button>
            <button data-filter="recent">🕒 Recent</button>
          </div>
        </div>
      </div>
    </header>

    <main class="main-with-header">
      <div id="resource-grid" class="resource-grid">
        <!-- 8 skeleton cards (the shimmer/loading will be replaced by JS) -->
        <!-- The actual content is rendered by resource-browser.js -->
      </div>

      <div id="load-more-container">
        <div id="load-more-spinner" style="display: none;" class="loading-spinner-small">Loading more...</div>
        <button id="load-more-btn" class="btn-secondary" style="display: none;">Load More</button>
      </div>
    </main>
  </div>

  <!-- ===== VIEWER VIEW (Embedded) ===== -->
  <div id="viewer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: var(--bg-primary);">
    <div class="viewer-container" style="height: 100%; display: flex; flex-direction: column;">
      <header class="viewer-header" id="viewer-header">
        <div class="left-group">
          <button id="viewer-outline-btn" class="btn-icon" title="Document outline">☰</button>
          <button id="viewer-back-btn" class="btn-back" aria-label="Back to resources">
            <span aria-hidden="true">←</span> Back
          </button>
          <div class="viewer-title" id="viewer-title">Loading...</div>
        </div>
        <div class="right-group">
          <button id="viewer-search-btn" class="btn-icon" title="Search">🔍</button>
          <div class="search-bar" id="viewer-search-bar">
            <input type="text" id="viewer-search-input" placeholder="Find..." autocomplete="off">
            <span class="search-results" id="viewer-search-count"></span>
            <button id="viewer-search-prev" class="btn-icon" title="Previous match">↑</button>
            <button id="viewer-search-next" class="btn-icon" title="Next match">↓</button>
            <div class="search-options" id="viewer-search-options">
              <label><input type="checkbox" id="viewer-search-case"> Aa</label>
              <label><input type="checkbox" id="viewer-search-whole"> “”</label>
            </div>
            <button id="viewer-search-close" class="btn-icon" title="Close search">✕</button>
          </div>
          <button id="viewer-toggle-view" class="btn-icon" title="Toggle view">📄 Page View</button>
          <button id="viewer-open-local" class="btn-icon" title="Open local file">📂</button>
          <button id="viewer-fullscreen-btn" class="btn-icon" title="Fullscreen">⛶</button>
        </div>
        <!-- Outline drawer (populated by viewer.js) -->
        <div class="outline-drawer" id="viewer-outline-drawer"></div>
      </header>

      <main class="viewer-main" id="viewer-main">
        <div class="loading-container" id="viewer-loading">
          <div class="spinner"></div>
          <p>Loading document...</p>
        </div>
        <progress id="viewer-progress" style="display: none; width: 80%; margin: 1rem auto;"></progress>
      </main>

      <div class="viewer-footer" id="viewer-footer" style="display: none;">
<div class="page-nav">
  <button id="viewer-prev-page" disabled>◀ Previous</button>
  <div class="page-counter">
    <label for="viewer-page-input">Page</label>
    <input type="number" id="viewer-page-input" value="1" min="1" step="1">
    <span>of <span id="viewer-page-count">1</span></span>
  </div>
  <button id="viewer-next-page" disabled>Next ▶</button>
</div>
        <div class="zoom-controls">
          <button id="viewer-zoom-out" title="Zoom out">−</button>
          <span id="viewer-zoom-level">100%</span>
          <button id="viewer-zoom-in" title="Zoom in">+</button>
          <button id="viewer-zoom-fit" title="Fit to width">⛶</button>
          <button id="viewer-zoom-reset" title="Reset zoom">1:1</button>
        </div>
      </div>

      <!-- Hidden file input for local files -->
      <input type="file" id="viewer-file-input" class="file-input" accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.docx,.doc,.pptx,.ppt,.txt,.md">
    </div>
  </div>
</section>
