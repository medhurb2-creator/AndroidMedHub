<section
  class="page subject-specific-page"
  data-page="subject-specific"
  data-script="/scripts/pages/subject-specific.js"
  data-style="/css/subject-specific.css"
  data-title="Select Topics"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <!-- ===== SHIMMER OVERLAY ===== -->
  <div id="shimmer-content">
    <div class="shimmer-header">
      <div class="shimmer-logo">
        <div class="shimmer-logo-icon"></div>
        <div class="shimmer-logo-text"></div>
      </div>
      <div>
        <span class="shimmer-btn-sm" style="margin-right:0.5rem;"></span>
        <span class="shimmer-btn-sm"></span>
      </div>
    </div>
    <div class="shimmer-wrapper">
      <div class="shimmer-subject">
        <div class="shimmer-icon"></div>
        <div class="shimmer-title"></div>
      </div>
      <div class="shimmer-stats">
        <div class="shimmer-stat"></div>
        <div class="shimmer-stat"></div>
        <div class="shimmer-stat"></div>
      </div>
      <div class="shimmer-actions">
        <div class="shimmer-btn"></div>
        <div class="shimmer-btn"></div>
      </div>
      <div class="shimmer-topics">
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
        <div class="shimmer-topic"></div>
      </div>
    </div>
  </div>

  <!-- ===== REAL CONTENT ===== -->
  <div id="real-content">
    <div class="page-container">
      <!-- Fixed Header – TWO ROWS -->
      <header class="fixed-header">
        <div class="header-row top">
          <div class="left-group">
            <img src="/assets/images/logo.png" alt="Logo" width="32" height="32" />
            <span class="brand">MedVix</span>
            <button id="backBtn" class="btn-text">Subjects</button>
          </div>
          <div class="right-group">
            <button id="themeToggle" class="btn-outline">🌓</button>
          </div>
        </div>
        <div class="header-row bottom">
          <button class="mode-btn active" data-mode="internal" id="modeInternal">Internal Exam</button>
          <button class="mode-btn" data-mode="pdf" id="modePdf">Export as PDF</button>
        </div>
      </header>

      <!-- Subject Metadata -->
      <div class="subject-header-info">
        <div class="subject-title">
          <span id="header-subject-icon" class="icon"></span>
          <h1 id="header-subject-name"></h1>
          <span id="header-subject-color" class="color-dot"></span>
        </div>
        <div class="total-questions" id="header-total-questions"></div>
      </div>

      <!-- Selection Summary -->
      <div class="selection-summary" id="selection-summary">
        <div class="summary-stats">
          <span id="selected-count">0 of 0 topics selected</span>
          <span id="selected-questions">0 questions selected</span>
          <span id="estimated-time">~0h 0m</span>
          <span id="pdf-sub-required" style="color:var(--accent);font-weight:600;display:none;">⭐ Subscription required</span>
        </div>
        <div class="action-buttons">
          <button id="primary-action-btn" class="btn-primary" disabled>Start Exam</button>
          <button id="secondary-action-btn" class="btn-secondary" disabled>Quick Exam (10q)</button>
        </div>
      </div>

      <!-- Subject sections -->
      <div id="subject-container">
        <!-- Anatomy -->
        <div id="anatomy-topics" class="subject-section" data-subject="anatomy" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="anatomy">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="anatomy">Clear All</button>
            </div>
            <div id="anatomy-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Physiology -->
        <div id="physiology-topics" class="subject-section" data-subject="physiology" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="physiology">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="physiology">Clear All</button>
            </div>
            <div id="physiology-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Biochemistry -->
        <div id="biochemistry-topics" class="subject-section" data-subject="biochemistry" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="biochemistry">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="biochemistry">Clear All</button>
            </div>
            <div id="biochemistry-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Histology -->
        <div id="histology-topics" class="subject-section" data-subject="histology" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="histology">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="histology">Clear All</button>
            </div>
            <div id="histology-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Embryology -->
        <div id="embryology-topics" class="subject-section" data-subject="embryology" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="embryology">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="embryology">Clear All</button>
            </div>
            <div id="embryology-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Pathology -->
        <div id="pathology-topics" class="subject-section" data-subject="pathology" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="pathology">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="pathology">Clear All</button>
            </div>
            <div id="pathology-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Pharmacology -->
        <div id="pharmacology-topics" class="subject-section" data-subject="pharmacology" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="pharmacology">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="pharmacology">Clear All</button>
            </div>
            <div id="pharmacology-topics-tree" class="topic-tree"></div>
          </div>
        </div>
        <!-- Microbiology -->
        <div id="microbiology-topics" class="subject-section" data-subject="microbiology" style="display:none;">
          <div class="topic-selection">
            <div class="selection-actions">
              <button class="btn-secondary select-all-btn" data-subject="microbiology">Select All</button>
              <button class="btn-secondary clear-all-btn" data-subject="microbiology">Clear All</button>
            </div>
            <div id="microbiology-topics-tree" class="topic-tree"></div>
          </div>
        </div>
      </div>

      <!-- Recent Topics Section -->
      <div id="recent-section" class="recent-section hidden">
        <h3>📌 Recent & Weak Topics</h3>
        <div id="recent-topics-list"></div>
      </div>

      <footer></footer>
    </div>
  </div>
</section>
