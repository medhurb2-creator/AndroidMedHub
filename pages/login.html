<section
  class="page login-page"
  data-page="login"
  data-script="/scripts/pages/login.js"
  data-style="/css/login.css"
  data-title="Login"
  data-auth="none"
  data-cache="true"
  data-transition="fade"
>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">
      <img src="/assets/images/logo.png" alt="MedVix Logo" width="40" height="40" />
      <span>MedVix</span>
    </div>
    <button id="themeToggle" class="btn-outline" aria-label="Toggle theme">🌓</button>
  </header>

  <!-- ===== LOGIN FORM ===== -->
  <main>
    <div class="form-container">
      <h2>Login to your account</h2>

      <!-- ===== Google Sign-In ===== -->
      <div id="google-login-container" class="google-signin-container"></div>

      <div class="auth-divider"><span>or</span></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email or Phone (254...)</label>
          <input type="text" id="email" name="email"
            placeholder="e.g., 254712345678 or student@example.com"
            autocomplete="username" required />
          <div class="error-message" data-for="email"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
            placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" id="togglePassword" class="reveal-btn" aria-label="Toggle password visibility">
            👁️
          </button>
          <div class="error-message" data-for="password"></div>
        </div>

        <div class="form-row">
          <label>
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <button type="button" id="forgotBtn" class="btn-link">
            Forgot password?
          </button>
        </div>

        <div class="action-buttons">
          <button type="submit" class="btn-primary">Login</button>
          <button id="signupBtn" class="btn-secondary" type="button">Create account</button>
        </div>
      </form>

      <p class="security-note">
        🔒 Time manipulation will lock your account. Never share password.
      </p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <button id="backBtn" class="btn-text">← Back</button>
  </footer>

  <!-- ============================================================
       Google account-linking modal
       (shown when the Google email already belongs to an existing account)
       ============================================================ -->
  <div id="google-link-modal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>You already have an account</h3>
        <button class="modal-close" id="google-link-close">&times;</button>
      </div>
      <div class="modal-body">
        <p>
          A MedVix account already exists with
          <strong id="google-link-email">—</strong>.
        </p>
        <p>Enter your MedVix password to connect Google Sign-In to that account.</p>

        <div class="form-group">
          <label for="google-link-password">MedVix password</label>
          <input type="password" id="google-link-password"
                 placeholder="••••••••" autocomplete="current-password" />
          <div class="error-message" data-for="google-link-password"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="google-link-cancel">Cancel</button>
        <button class="btn-primary" id="google-link-submit">Connect Google</button>
      </div>
    </div>
  </div>
</section>
