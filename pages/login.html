<section
  class="page login-page"
  data-page="login"
  data-script="/scripts/pages/login.js"
  data-style="/css/login.css"
  data-title="Login"
  data-auth="none"
  data-cache="true"
  data-transition="fade"
>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">
      <img src="/assets/images/logo.png" alt="MedVix Logo" width="40" height="40" />
      <span>MedVix</span>
    </div>
    <button id="themeToggle" class="btn-outline" aria-label="Toggle theme">🌓</button>
  </header>

  <!-- ===== LOGIN FORM ===== -->
  <main>
    <div class="form-container">
      <h2>Login to your account</h2>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email or Phone (254...)</label>
          <input type="text" id="email" name="email"
            placeholder="e.g., 254712345678 or student@example.com"
            autocomplete="username" required />
          <div class="error-message" data-for="email"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
            placeholder="••••••••" autocomplete="current-password" required />
          <button type="button" id="togglePassword" class="reveal-btn" aria-label="Toggle password visibility">
            👁️
          </button>
          <div class="error-message" data-for="password"></div>
        </div>

        <div class="form-row">
          <label>
            <input type="checkbox" id="remember" /> Remember me
          </label>
          <button type="button" id="forgotBtn" class="btn-link">
            Forgot password?
          </button>
        </div>

        <div class="action-buttons">
          <button type="submit" class="btn-primary">Login</button>
          <button id="signupBtn" class="btn-secondary">Create account</button>
        </div>
      </form>

      <p class="security-note">
        🔒 Time manipulation will lock your account. Never share password.
      </p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <button id="backBtn" class="btn-text">← Back</button>
  </footer>
</section>
