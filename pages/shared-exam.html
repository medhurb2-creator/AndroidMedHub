<section
  class="page shared-exam-page"
  data-page="shared-exam"
  data-script="/scripts/pages/shared-exam.js"
  data-style="/css/shared-exam.css"
  data-title="Shared Exam"
  data-auth="none"
  data-cache="true"
  data-transition="fade"
>
  <div class="page-container">

    <!-- ===== FIXED HEADER (Row 1) ===== -->
    <header class="fixed-header">
      <div class="logo">
        <img src="/assets/images/logo.png" alt="Logo" width="32" height="32">
        <span>MedVix</span>
      </div>
      <div class="header-right">
        <button id="themeToggle" class="btn-outline">🌓</button>
      </div>
    </header>

    <!-- ===== FIXED NOTICE BAR (Row 2) ===== -->
    <div class="fixed-notice" id="noticeBar">
      <div class="left">
        <span class="share-badge">SHARED</span>
        <p class="read-only-note">You are viewing a read‑only shared exam.</p>
      </div>
      <div class="actions" id="cta-actions">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- ===== SCROLLABLE CONTENT ===== -->
    <div class="scroll-content" id="scrollContent">
      <div id="shared-results-container">
        <div class="loading" style="text-align:center; padding:2rem; color:var(--text-muted);">Loading exam...</div>
      </div>
    </div>

    <!-- ===== FIXED FOOTER ===== -->
    <footer class="fixed-footer">
      <button id="homeBtn" class="btn-text">← Home</button>
      <button id="shareBtn" class="btn-share">📤 Share</button>
    </footer>

    <!-- ===== AUTH MODAL ===== -->
    <div class="modal-overlay" id="authModal">
      <div class="modal-card">
        <button class="modal-close" id="modalCloseBtn">&times;</button>
        <h3>🔒 Sign in to download</h3>
        <p>You need an account to save this exam to your personal collection.</p>
        <div class="modal-actions">
          <button id="loginModalBtn" class="btn btn-primary">Log In</button>
          <div class="modal-divider"><span>or</span></div>
          <button id="signupModalBtn" class="btn btn-secondary">Create Account</button>
        </div>
      </div>
    </div>

  </div>
</section>
