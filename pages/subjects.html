  <div id="real-content" class="page-container">
    <!-- Fixed header -->
    <header>
      <div class="logo">
        <img src="/assets/images/logo.png" alt="Logo" width="40" height="40" />
        <span>MedVix</span>
      </div>
      <div class="header-actions">
        <button id="notifBtn" class="btn-icon notification-btn" title="Notifications">
          🔔
          <span id="notificationBadge" class="notification-badge" style="display:none;">0</span>
        </button>
        <button id="themeToggle" class="btn-outline">🌓</button>
        <button id="logoutBtn" class="btn-text">Logout</button>
      </div>
    </header>

    <!-- Second bar -->
    <div class="second-bar">
      <h2 id="user-greeting">Hello, Doctor</h2>
      <div id="sub-status" class="subscription-info">Loading...</div>
    </div>

    <!-- Quick actions -->
    <div class="welcome-banner">
      <div class="quick-actions">
        <button id="continue-last" style="display:none;" class="btn-secondary">▶ Continue Last Exam</button>
        <button id="weak-areas" style="display:none;" class="btn-secondary">
          <span id="weak-areas-count"></span>
        </button>
        <button id="quickExamBtn" class="btn-primary">⚡ Quick Exam (10q)</button>
      </div>
    </div>

    <main>
      <div class="subjects-header">
        <h1>Subjects</h1>
        <div id="subjectsToggle" class="subjects-toggle" style="display:none;">
          <button class="active" data-view="core">Core</button>
          <button data-view="other">Other</button>
        </div>
        <div id="searchBar" class="search-bar">
          <span class="search-icon">🔍</span>

        </div>
      </div>
      <div id="subjects-count" class="subjects-count" style="display:none;"></div>
      <div id="subject-grid" class="subject-grid"></div>
    </main>

<!-- Fixed footer -->
<div class="app-footer">
