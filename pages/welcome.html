<section
  class="page welcome-page"
  data-page="welcome"
  data-script="/scripts/pages/welcome.js"
  data-style="/css/welcome.css"
  data-title="Welcome"
  data-auth="none"
  data-cache="true"
  data-transition="fade"
>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">
      <img src="/assets/images/logo.png" alt="MedVix Logo" width="40" height="40" />
      <span>MedVix</span>
    </div>
    <button id="themeToggle" class="btn-outline" aria-label="Toggle theme">🌓</button>
  </header>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="welcome-card">
      <h2>Welcome back, future doctor 👋</h2>
      <p>Access your 5,000+ question bank, track progress, and simulate exams.</p>

      <div class="action-buttons">
        <button id="loginBtn" class="btn-primary">Login</button>
        <button id="signupBtn" class="btn-secondary">Create Account</button>
        <button id="guestBtn" class="btn-link">Continue as Guest</button>
      </div>

      <p class="guest-note">
        Guest mode: browse subjects, see question counts. Subscribe to take exams.
      </p>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <button id="backHomeBtn" class="btn-text">← Back to Home</button>
  </footer>
</section>
