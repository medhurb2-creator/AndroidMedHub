<section
  class="page results-page"
  data-page="results"
  data-script="/scripts/pages/results.js"
  data-style="/css/results.css"
  data-title="Exam Results"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <div class="page-container">
    <!-- FIXED HEADER (2 rows) -->
    <header class="results-header-fixed">
      <div class="header-row top">
        <div class="left-group">

          <button id="subjectsBtn" class="btn-text">Subjects</button>
        </div>
        <div class="right-group">
          <button id="themeToggle" class="btn-outline">🌓</button>
        </div>
      </div>
      <div class="header-row bottom">
        <h1 class="page-title">Exam Results</h1>
        <div class="action-group">
          <button id="downloadBtn" class="btn-download">
            <i class="fas fa-download"></i> Download Exam
          </button>
          <button id="analyticsBtn" class="btn-analytics">
            <i class="fas fa-chart-line"></i> Analytics
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- Score Summary Card -->
      <div class="summary-card" id="summaryCard">
        <div class="score-section">
          <div class="score-circle" id="scoreCircle">
            <span id="score-percentage">0%</span>
          </div>
          <div class="score-stats">
            <div class="stat-row">
              <span class="stat-label">Correct</span>
              <span class="stat-value" id="correct-count">0/0</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">Time</span>
              <span class="stat-value" id="time-stats">0s / 0s (0%)</span>
            </div>
          </div>
        </div>
        <div class="meta-section">
          <div class="meta-item">
            <span class="meta-label">Grade</span>
            <span class="meta-value" id="grade">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Date</span>
            <span class="meta-value" id="exam-date">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Subject</span>
            <span class="meta-value" id="exam-subject">-</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Mode</span>
            <span class="meta-value" id="exam-mode">-</span>
          </div>
        </div>
      </div>

      <!-- Topic Performance -->
      <div id="topic-performance" class="topic-section" style="display:none;"></div>

      <!-- Recommendations -->
      <div id="recommendations" class="recommendations" style="display:none;"></div>

      <!-- Question Review -->
      <div class="review-section" id="reviewSection" style="display:none;">
        <h2>Question Review</h2>
        <div id="review-list" class="review-list"></div>
      </div>
    </main>
  </div>
</section>
