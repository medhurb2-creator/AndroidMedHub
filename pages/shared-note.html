<section
  class="page shared-note-page"
  data-page="shared-note"
  data-script="/scripts/pages/shared-note.js"
  data-style="/css/shared-note.css"
  data-title="Shared Note"
  data-auth="none"
  data-cache="true"
  data-transition="fade"
>
  <div class="page-container">

    <!-- ═══════════ FIXED HEADER ═══════════ -->
    <header class="shared-note-header" id="sharedNoteHeader">
      <div class="logo">
        <img src="/assets/images/logo.png" alt="MedVix logo" width="36" height="36">
        <span>MedVix</span>
      </div>
      <div class="header-right">
        <button
          id="themeToggle"
          class="btn-outline"
          type="button"
          aria-label="Toggle dark or light theme"
          title="Toggle theme"
        >🌓</button>
      </div>
    </header>

    <!-- ═══════════ SCROLLABLE CONTENT ═══════════ -->
    <main class="shared-note-main">
      <div id="shared-note-container" class="shared-note-container">
        <div class="loading">Loading note...</div>
      </div>
    </main>

    <!-- ═══════════ FIXED FOOTER NAV (performance-page style) ═══════════ -->
    <footer class="app-footer" id="sharedNoteFooter">
      <button class="footer-btn" data-route="subjects" title="Subjects" type="button">
        📚<span>Subjects</span>
      </button>
      <button class="footer-btn" data-route="performance" title="Performance" type="button">
        📊<span>Performance</span>
      </button>
      <button class="footer-btn" data-route="ai" title="AI Tutor" type="button">
        🤖<span>AI Tutor</span>
      </button>
      <button class="footer-btn" data-route="notes" title="Notes" type="button">
        📝<span>Notes</span>
      </button>
    </footer>

  </div>
</section>
