<section
  class="page notes-page"
  data-page="notes"
  data-script="/scripts/pages/notes.js"
  data-style="/css/notes.css"
  data-title="My Notes"
  data-auth="required"
  data-cache="true"
  data-transition="fade"
>
  <!-- Hidden logo for PDF generation -->
  <img id="medvix-logo-img" src="/assets/images/logo.jpeg" style="display:none;">

  <!-- Header -->
<header class="notes-header">
  <div class="header-left">
    <button id="hamburgerBtn" class="hamburger icon-btn" aria-label="Open menu" title="Open menu">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <span class="page-title">My Notes</span>
  </div>
  <div class="header-right">
    <a id="performanceLink" class="nav-link icon-btn" title="Performance" aria-label="Performance">
      <i class="fa-solid fa-chart-bar icon-primary" aria-hidden="true"></i>
      <span>Performance</span>
    </a>
    <a id="aiLink" class="nav-link icon-btn" title="AI Tutor" aria-label="AI Tutor">
      <i class="fa-solid fa-robot icon-purple" aria-hidden="true"></i>
      <span>AI</span>
    </a>
    <a id="subjectsLink" class="nav-link icon-btn" title="Subjects" aria-label="Subjects">
      <i class="fa-solid fa-book icon-primary" aria-hidden="true"></i>
      <span>Subjects</span>
    </a>
    <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">
      <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
    </button>
  </div>
</header>

  <!-- History Panel -->
  <div class="history-panel" id="historyPanel">
    <div class="history-header">
      <h3>Recent Notes</h3>
      <span id="closeHistoryBtn" class="close-history">✖</span>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- Dashboard View -->
  <div id="dashboard-view">
    <div class="notes-toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="work">Work</button>
        <button class="filter-tab" data-filter="personal">Personal</button>
      </div>
      <input type="text" id="searchNotes" placeholder="🔍 Search notes...">
    </div>
    <div class="note-grid" id="notesGrid"></div>
    <button id="fabBtn" class="fab">+</button>
  </div>

  <!-- Editor View -->
  <div id="editor-view">
    <div class="edit-header">
      <div class="edit-header-left">
        <span id="backEditorBtn" class="back-btn">❮</span>
        <span class="page-title">Edit Note</span>
      </div>
      <div class="edit-header-right">
        <span id="lockTool" class="tool-icon" title="Password protect">🔒</span>
        <span id="shareTool" class="tool-icon" title="Share">🔗</span>
        <span id="exportTool" class="tool-icon" title="Export PDF">📄</span>
        <button id="saveNoteBtn" class="save-btn">Save</button>
        <span id="menuTool" class="tool-icon">⋮</span>
      </div>
    </div>
    <div class="edit-body">
      <input type="text" id="noteTitle" placeholder="Note title...">
      <div class="date-line" id="noteDate"></div>
      <div id="noteContent"></div>
    </div>
  </div>

  <!-- Share Modal -->
  <div id="share-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Share Note</h3>
        <button id="closeShareModalBtn" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 0.75rem;">Share this note with others. Anyone with the link can view it.</p>
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
          <input type="text" id="share-link-input" readonly
            style="flex:1; padding:0.5rem; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-secondary); color:var(--text-primary); font-family:monospace; font-size:0.85rem;">
          <button id="copyShareLinkBtn" class="btn-secondary">📋 Copy</button>
          <button id="shareViaNativeBtn" class="btn-primary">📤 Share</button>
        </div>
        <div style="text-align: center; margin: 1rem 0;">
          <div id="share-qr-code"
            style="display: inline-block; background: white; padding: 0.5rem; border-radius: var(--radius-sm);">
          </div>
        </div>
        <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">Scan the QR code to open on mobile</p>
      </div>
    </div>
  </div>
</section>
