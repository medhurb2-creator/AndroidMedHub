<section
  class="page forgot-password-page"
  data-page="forgot-password"
  data-script="/scripts/pages/forgot-password.js"
  data-style="/css/forgot-password.css"
  data-title="Reset Password"
  data-auth="none"
  data-cache="true"
  data-transition="fade"
>
  <div class="page-container">
    <header>
      <div class="logo">
        <img src="/assets/images/logo.png" alt="Logo" width="40" height="40">
        <span>MedVix</span>
      </div>
      <button id="themeToggle" class="btn-outline">🌓</button>
    </header>

    <main class="form-container">
      <h1>Reset Password</h1>

      <!-- Step 1: Email/Phone -->
      <div id="step1">
        <p class="instruction">Enter your registered email address or phone number.</p>
        <form id="step1-form">
          <div class="form-group">
            <label for="email">Email or Phone</label>
            <input type="text" id="email" name="email" placeholder="e.g., student@example.com or 254712345678" required autofocus>
          </div>
          <button type="submit" class="btn-primary">Continue</button>
        </form>
        <p class="back-link">
          <button id="backToLogin" class="btn-text">← Back to Login</button>
        </p>
      </div>

      <!-- Step 2: Security Questions -->
      <div id="step2" style="display:none;">
        <p class="instruction">Answer the security questions you set during registration.</p>
        <div id="questions-container"></div>
        <button id="verifyAnswersBtn" class="btn-primary">Verify Answers</button>
        <p class="back-link">
          <button id="backToStep1" class="btn-text">← Back</button>
        </p>
      </div>

      <!-- Step 3: New Password -->
      <div id="step3" style="display:none;">
        <p class="instruction">Enter your new password.</p>
        <form id="step3-form">
          <div class="form-group">
            <label for="new-password">New password</label>
            <input type="password" id="new-password" required>
            <small>8+ characters, at least one uppercase, one lowercase, one number</small>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm new password</label>
            <input type="password" id="confirm-password" required>
          </div>
          <button type="submit" class="btn-primary">Reset Password</button>
        </form>
        <p class="back-link">
          <button id="backToStep2" class="btn-text">← Back</button>
        </p>
      </div>
    </main>
  </div>
</section>
